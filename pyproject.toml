[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbridge-factory"
version = "0.1.0"
description = "Issues in, reviewed pull requests out: coding agents on your own Gitea, with the gates checked by the host."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://lumbridgecorp.com"
Repository = "https://github.com/lumbridge-corp/lumbridge-factory"

[project.scripts]
lumbridge-factory = "lumbridge_factory.cli:main"

[tool.setuptools.packages.find]
include = ["lumbridge_factory*"]

[tool.setuptools.package-data]
"lumbridge_factory.agentd" = ["*.sh"]
